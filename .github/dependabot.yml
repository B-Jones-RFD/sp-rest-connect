version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # @types/node should track the lowest supported Node major (see "engines").
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript majors change compiler defaults/APIs; bump deliberately.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
